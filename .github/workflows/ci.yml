name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and static checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: python -m pip install --editable .

      - name: Check dependencies
        run: python -m pip check

      - name: Check formatting
        run: python -m black --check src experiments tests

      - name: Lint
        run: python -m ruff check src experiments tests

      - name: Type check
        run: python -m pyright src tests experiments

      - name: Compile sources
        run: python -m compileall -q src experiments tests

      - name: Run tests
        run: python -m pytest

      - name: Check whitespace
        run: git diff --check
